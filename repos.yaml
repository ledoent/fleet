# Fleet git-aggregator configuration
# Merges upstream main + feature branches into a deployable aggregated branch.
#
# Local usage:
#   gitaggregate -c repos.yaml -p aggregate
#
# CI: weekly-aggregate.yml runs on schedule + workflow_dispatch.

./fleet:
  remotes:
    upstream: https://github.com/fleetdm/fleet.git
    fork: https://github.com/ledoent/fleet.git
  target: fork aggregated
  merges:
    - remote: upstream
      ref: main
    - remote: fork
      ref: ledoent
    - remote: fork
      ref: patches/premium-license
    - remote: fork
      ref: feat/pg-compat-clean
