name: Go Tests (PostgreSQL)

on:
  push:
    branches:
      - main
      - patch-*
      - prepare-*
      - aggregated
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'server/datastore/mysql/pg_baseline_schema.sql'
      - '.github/workflows/test-go-postgres.yaml'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'server/datastore/mysql/pg_baseline_schema.sql'
      - '.github/workflows/test-go-postgres.yaml'
      - 'docker-compose.yml'
  workflow_dispatch: # Manual

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test-go-postgres:
    name: postgres (${{ matrix.postgres }})
    # Don't cancel other matrix legs if one fails.
    continue-on-error: true
    runs-on: ubuntu-latest

    strategy:
      matrix:
        postgres: ["postgres:16"]

    env:
      GO_TEST_TIMEOUT: 20m

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: 'go.mod'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Download Go modules (with retry)
        # proxy.golang.org occasionally aborts module zips mid-stream
        # (INTERNAL_ERROR); retriable, but a single failure would fail the
        # test step outright.
        run: |
          for attempt in 1 2 3; do
            go mod download && break
            echo "go mod download failed (attempt $attempt); retrying..."
            sleep 10
          done

      - name: Start postgres_test container
        run: |
          FLEET_POSTGRES_IMAGE=${{ matrix.postgres }} \
            docker compose -f docker-compose.yml up -d postgres_test &

      - name: Wait for PostgreSQL
        run: |
          wait_for_pg() {
            local timeout_seconds=60
            local start_time=$(date +%s)
            local attempt_logs=""

            echo "Waiting for postgres_test (${{ matrix.postgres }})..."
            while true; do
              current_time=$(date +%s)
              elapsed=$((current_time - start_time))
              if [ $elapsed -ge $timeout_seconds ]; then
                echo "Timeout (${timeout_seconds}s) waiting for postgres_test"
                echo "$attempt_logs"
                docker compose logs postgres_test
                return 1
              fi

              output=$(docker compose exec -T postgres_test pg_isready -U fleet 2>&1)
              exit_code=$?
              timestamp=$(date "+%Y-%m-%d %H:%M:%S")
              attempt_logs="${attempt_logs}\n${timestamp} - exit ${exit_code}: ${output}"

              if [ $exit_code -eq 0 ]; then
                echo "postgres_test is ready"
                return 0
              fi

              echo "."
              sleep 1
            done
          }

          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts"
            if wait_for_pg; then
              exit 0
            fi
            if [ $attempt -lt $max_attempts ]; then
              echo "Restarting postgres_test..."
              docker compose stop postgres_test
              FLEET_POSTGRES_IMAGE=${{ matrix.postgres }} \
                docker compose -f docker-compose.yml up -d postgres_test
              sleep 5
            fi
            attempt=$((attempt + 1))
          done
          echo "Failed to connect to PostgreSQL after $max_attempts attempts"
          exit 1

      - name: Run PostgreSQL Go Tests
        run: |
          gotestsum --format=testdox --jsonfile=/tmp/test-output.json -- \
            -v \
            -timeout=$GO_TEST_TIMEOUT \
            -run "TestPostgres" \
            ./server/datastore/mysql/... 2>&1 | tee /tmp/gotest.log
        env:
          POSTGRES_TEST: "1"
          FLEET_POSTGRES_TEST_PORT: "5434"

      - name: Generate summary of errors
        if: failure()
        run: |
          c1grep() { grep "$@" || test $? = 1; }
          c1grep -oP 'FAIL: .*$' /tmp/gotest.log > /tmp/summary.txt
          c1grep 'test timed out after' /tmp/gotest.log >> /tmp/summary.txt
          c1grep 'fatal error:' /tmp/gotest.log >> /tmp/summary.txt
          c1grep -A 10 'panic: runtime error: ' /tmp/gotest.log >> /tmp/summary.txt
          c1grep ' FAIL\t' /tmp/gotest.log >> /tmp/summary.txt

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: postgres-${{ strategy.job-index }}-test-log
          path: /tmp/gotest.log
          if-no-files-found: error

      - name: Upload summary test log
        if: always()
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: postgres-${{ strategy.job-index }}-summary-log
          path: /tmp/summary.txt

      - name: Upload JSON test output
        if: always()
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: postgres-${{ strategy.job-index }}-test-json
          path: /tmp/test-output.json
          if-no-files-found: warn

      - name: Set test status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            echo "success" > /tmp/status
          else
            echo "fail" > /tmp/status
          fi

      - name: Upload status indicator
        if: always()
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: postgres-${{ strategy.job-index }}-status
          path: /tmp/status
          overwrite: true

  # Explicit pass/fail gate — mirrors the pattern in test-go.yaml's aggregate-result.
  # This job is what GitHub branch protection rules should check.
  aggregate-result:
    name: PostgreSQL tests result
    needs: [test-go-postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download status artifacts
        uses: actions/download-artifact@9c19ed7fe5d278cd354c7dfd5d3b88589c7e2395 # v4.1.6
        with:
          pattern: 'postgres-*-status'

      - name: Check for failures
        run: |
          # Expected status artifact directory names — one per matrix leg.
          # Must be kept in sync with the postgres matrix above.
          expected=("postgres-0-status")
          failed=""
          for dir in "${expected[@]}"; do
            status_file="./${dir}/status"
            if [[ ! -f "$status_file" ]]; then
              echo "❌ Missing status file: $dir (matrix leg did not report — likely runner crash or cancellation)"
              failed="${failed}${dir} (missing), "
              continue
            fi
            if grep -q "fail" "$status_file"; then
              echo "❌ Failed: $dir"
              failed="${failed}${dir}, "
            else
              echo "✅ Passed: $dir"
            fi
          done
          if [[ -n "$failed" ]]; then
            echo "❌ One or more PostgreSQL test jobs failed or did not report: ${failed%, }"
            exit 1
          fi
          echo "✅ All PostgreSQL test jobs passed"
